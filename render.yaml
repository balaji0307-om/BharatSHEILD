services:
  - type: web
    name: bharatshield
    runtime: python
    plan: free
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.secure_main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VITE_API_BASE_URL
        value: ""
      - key: CORS_ORIGINS
        value: https://bharatshield.onrender.com,https://bharatsheild.onrender.com
